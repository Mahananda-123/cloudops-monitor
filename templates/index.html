<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudOps Monitor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>CloudOps Monitor Dashboard</h1>

        <div class="card">
            <h2>CPU Usage</h2>
            <p>{{ cpu }}%</p>
        </div>

        <div class="card">
            <h2>Memory Usage</h2>
            <p>{{ memory }}%</p>
        </div>

        <div class="card">
            <h2>Disk Usage</h2>
            <p>{{ disk }}%</p>
        </div>

        <div class="card">
            <h2>System Information</h2>
            <p>Hostname: {{ hostname }}</p>
            <p>Operating System: {{ system }}</p>
            <p>Current Time: {{ time_now }}</p>
        </div>

    </div>

</body>
</html>
