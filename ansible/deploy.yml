---
- hosts: localhost
  connection: local

  tasks:

    - name: Stop old container
      shell: docker stop monitor-container
      ignore_errors: yes

    - name: Remove old container
      shell: docker rm -f monitor-container
      ignore_errors: yes

    - name: Remove dangling container
      shell: docker container prune -f

    - name: Build Docker image
      shell: docker build -t cloudops-monitor ..

    - name: Run docker container
      shell: docker run -d -p 5000:5000 --name monitor-container cloudops-monitor